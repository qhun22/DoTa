workflows:
  dota-truyen-ky-ios:
    name: Dota Truyen Ky · iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        BUNDLE_ID: "com.qhun22.dttk"
        APP_NAME: "DotaTruyenKy"
        LOVE_VERSION: "11.5"

    scripts:
      - name: Cài công cụ (ImageMagick để gen icon)
        script: brew install imagemagick

      - name: Clone Love2D iOS source
        script: |
          git clone --depth 1 --branch $LOVE_VERSION \
            https://github.com/love2d/love.git love-src

      - name: Clone thư viện XCFramework cho iOS (freetype, SDL2, Lua, ...)
        script: |
          set -eo pipefail
          git clone --depth 1 --branch $LOVE_VERSION \
            https://github.com/love2d/love-apple-dependencies.git apple-deps
          mv apple-deps/iOS/libraries love-src/platform/xcode/ios/libraries
          ls love-src/platform/xcode/ios/libraries

      - name: Đóng gói game thành game.love
        script: |
          # Đóng gói toàn bộ game files (Lua + assets + font)
          zip -r game.love conf.lua main.lua login.lua logo.jpg assets/
          cp game.love love-src/platform/xcode/

      - name: Tạo AppIcon.appiconset
        script: |
          set -eo pipefail
          # Catalog icon THẬT mà Xcode project dùng (platform/xcode/Images.xcassets,
          # KHÔNG PHẢI platform/xcode/ios/Images.xcassets) — giữ nguyên tên file gốc
          # để không phải đụng tới Contents.json đã có sẵn.
          ICONSET="love-src/platform/xcode/Images.xcassets/iOS AppIcon.appiconset"
          if [ ! -d "$ICONSET" ]; then
            echo "ERROR: khong tim thay $ICONSET"
            exit 1
          fi

          declare -A SIZES=(
            ["icon-29pt@1x.png"]=29     ["icon-29pt@2x.png"]=58    ["icon-29pt@3x.png"]=87
            ["icon-40pt@1x.png"]=40     ["icon-40pt@2x.png"]=80    ["icon-40pt@3x.png"]=120
            ["icon-60pt@2x.png"]=120    ["icon-60pt@3x.png"]=180
            ["icon-76pt@1x.png"]=76     ["icon-76pt@2x.png"]=152
            ["icon-83.5pt@2x.png"]=167
            ["icon-1024pt@1x.png"]=1024
          )
          for file in "${!SIZES[@]}"; do
            px="${SIZES[$file]}"
            convert logo.jpg -resize ${px}x${px}! "$ICONSET/$file"
          done
          ls -la "$ICONSET"

      - name: Debug - liệt kê cấu trúc xcode
        script: |
          echo "=== platform/xcode layout ==="
          find love-src/platform/xcode -maxdepth 3 -name "*.plist" | sort
          echo "=== schemes ==="
          xcodebuild -project love-src/platform/xcode/love.xcodeproj -list 2>&1 | head -30

      - name: Patch Info.plist (bundle ID + tên app)
        script: |
          set -eo pipefail
          # File plist thật của target iOS tên là love-ios.plist (không phải Info.plist)
          PLIST="love-src/platform/xcode/ios/love-ios.plist"
          if [ ! -f "$PLIST" ]; then
            echo "ERROR: khong tim thay $PLIST"
            find love-src/platform/xcode -name "*.plist"
            exit 1
          fi
          echo "Using plist: $PLIST"

          plutil -replace CFBundleIdentifier  -string "$BUNDLE_ID"    "$PLIST"
          plutil -replace CFBundleName        -string "DotaTruyenKy"  "$PLIST"
          plutil -replace CFBundleDisplayName -string "$APP_NAME"     "$PLIST"
          plutil -replace UISupportedInterfaceOrientations \
            -json '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' \
            "$PLIST" || true

          echo "=== Noi dung sau khi patch ==="
          plutil -p "$PLIST" | grep -i "CFBundleIdentifier\|CFBundleName\|CFBundleDisplayName"

      - name: Build .app (unsigned — dành cho TrollStore)
        script: |
          set -eo pipefail
          cd love-src/platform/xcode

          # Tìm đúng scheme iOS
          SCHEME=$(xcodebuild -project love.xcodeproj -list 2>/dev/null \
            | grep -i "ios\|iPhone" | head -1 | xargs || echo "love-ios")
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -project love.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

          echo "=== Build output ==="
          find "$CM_BUILD_DIR/build" -name "*.app" | head -5

      - name: Nhúng game.love vào .app bundle
        script: |
          set -eo pipefail
          APP=$(find "$CM_BUILD_DIR/build" -name "*.app" \
            -not -path "*/Build/Intermediates*" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: .app bundle not found!"
            find "$CM_BUILD_DIR/build" -maxdepth 6 | sort
            exit 1
          fi

          echo "App bundle: $APP"
          cp game.love "$APP/game.love"
          ls -lh "$APP/game.love"

      - name: Đóng gói thành IPA
        script: |
          set -eo pipefail
          APP=$(find "$CM_BUILD_DIR/build" -name "*.app" \
            -not -path "*/Build/Intermediates*" | head -1)

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$APP" "$CM_BUILD_DIR/Payload/DotaTruyenKy.app"
          cd "$CM_BUILD_DIR"
          zip -r DotaTruyenKy.ipa Payload

          SIZE=$(du -sh DotaTruyenKy.ipa | cut -f1)
          echo "IPA size: $SIZE"
          # Fail nếu IPA nhỏ hơn 1MB (rõ ràng là rỗng)
          BYTES=$(stat -f%z DotaTruyenKy.ipa 2>/dev/null || stat -c%s DotaTruyenKy.ipa)
          if [ "$BYTES" -lt 1000000 ]; then
            echo "ERROR: IPA quá nhỏ ($BYTES bytes), build thất bại!"
            exit 1
          fi

    artifacts:
      - "$CM_BUILD_DIR/DotaTruyenKy.ipa"
